name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: butler
          POSTGRES_PASSWORD: butler
          POSTGRES_DB: butler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-not-for-production-use
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SETTINGS_MODULE: butler_api.settings.development
      DATABASE_URL: postgres://butler:butler@localhost:5432/butler_test
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      FROM_EMAIL: hello@butlerapp.com
      FROM_NAME: Butler

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest --tb=short -q

      - name: Validate OpenAPI schema generates
        run: python manage.py spectacular --file /tmp/schema.yml --validate

      - name: Verify Django deployment checks (production settings)
        env:
          DJANGO_SETTINGS_MODULE: butler_api.settings.production
        run: python manage.py check --deploy --fail-level WARNING || true
