# Render Infrastructure-as-Code — push-button deploy when Ryan's account is ready.
# Set env values in the Render dashboard before first deploy.
services:
  - type: web
    name: butler-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_admin
    startCommand: gunicorn butler_api.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: butler_api.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false   # set in dashboard once domain is known
      - key: DATABASE_URL
        fromDatabase:
          name: butler-db
          property: connectionString
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set in dashboard once Vercel URL is known
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6

databases:
  - name: butler-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
